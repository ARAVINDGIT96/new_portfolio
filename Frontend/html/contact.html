
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact Me</title>

    <link rel="stylesheet" href="../portfolio.css">

</head>


<body class="contact-page">


    <header class="contact-header">

        <h1>Contact Me</h1>

    </header>


    <section class="contact-section">

        <form class="contact-form" id="contactForm">


            <label for="name">
                <b>Name</b>
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name..."
                required
            >


            <label for="email">
                <b>Email</b>
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email..."
                required
            >


            <label for="phone">
                <b>Phone</b>
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter your phone no..."
            >


            <label for="message">
                <b>Message</b>
            </label>

            <textarea
                id="message"
                placeholder="Enter your message..."
                required
            ></textarea>


            <button type="submit">
                Send
            </button>


        </form>

    </section>


    <script src="../js/contact.js"></script>

</body>

</html>
